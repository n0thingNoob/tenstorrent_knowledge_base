name: Weekly Source Collection

on:
  workflow_dispatch:
  schedule:
    - cron: "0 14 * * 1"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run source collection
        run: python scripts/weekly_source_collect.py --since-days 14

      - name: Commit and push new raw sources
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add raw outputs/source_collection_state.json outputs/source-collection-*.md

          if git diff --cached --quiet; then
            echo "No staged source-collection changes."
            exit 0
          fi

          commit_message="Weekly source collection: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          git commit -m "$commit_message"
          git push
